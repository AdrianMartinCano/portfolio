<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&amp;display=swap');
      .display { font-family: 'Cormorant Garamond', Georgia, serif; }
    </style>
    <!-- arco para el texto superior -->
    <path id="topArc" d="M139.4 187.6 A 196 196 0 0 1 460.6 187.6" fill="none"/>
    <!-- estrella de 4 puntas (sparkle) -->
    <path id="star" d="M0,-12 C1,-3 3,-1 12,0 C3,1 1,3 0,12 C-1,3 -3,1 -12,0 C-3,-1 -1,-3 0,-12 Z"/>
    <!-- cristal -->
    <g id="crystal">
      <path d="M0,-34 L12,-13 L12,17 L0,34 L-12,17 L-12,-13 Z" fill="#0e3a45" stroke="#f4ecd8" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-6,-9 L0,-34 L6,-9 M-6,-9 L6,-9 M0,-9 L0,34" fill="none" stroke="#f4ecd8" stroke-width="2"/>
    </g>
  </defs>

  <!-- borde perforado de sello (tabs redondos) -->
  <circle cx="300" cy="300" r="250" fill="none" stroke="#0e3a45" stroke-width="16" stroke-linecap="round" stroke-dasharray="1 38"/>
  <!-- disco petróleo -->
  <circle cx="300" cy="300" r="242" fill="#0e3a45"/>
  <!-- filetes latón -->
  <circle cx="300" cy="300" r="224" fill="none" stroke="#a87f3e" stroke-width="3"/>
  <circle cx="300" cy="300" r="216" fill="none" stroke="#c8a25e" stroke-width="1"/>

  <!-- texto curvo: marca -->
  <text class="display" font-size="30" font-weight="600" letter-spacing="5" fill="#f4ecd8">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">LA CAJA DE LATÓN</textPath>
  </text>

  <!-- luna + estrellas + cristales (redibujada en vector) -->
  <g transform="translate(-14,-6)">
    <!-- creciente -->
    <path d="M348.7 231.8 A 90 90 0 1 0 348.7 368.2 A 74 74 0 0 1 348.7 231.8 Z"
          fill="none" stroke="#f4ecd8" stroke-width="4" stroke-linejoin="round"/>
    <!-- estrellas -->
    <use href="#star" transform="translate(404 234) scale(1.15)" fill="#f4ecd8"/>
    <use href="#star" transform="translate(360 286) scale(0.7)" fill="#f4ecd8"/>
    <use href="#star" transform="translate(436 276) scale(0.95)" fill="#f4ecd8"/>
    <!-- cristales -->
    <use href="#crystal" transform="translate(352 362) scale(0.72)"/>
    <use href="#crystal" transform="translate(396 362) scale(0.62)"/>
    <use href="#crystal" transform="translate(375 352) scale(1)"/>
  </g>

  <!-- ornamento inferior -->
  <line x1="250" y1="486" x2="286" y2="486" stroke="#a87f3e" stroke-width="2"/>
  <rect x="294" y="480" width="12" height="12" fill="#a87f3e" transform="rotate(45 300 486)"/>
  <line x1="314" y1="486" x2="350" y2="486" stroke="#a87f3e" stroke-width="2"/>
</svg>
